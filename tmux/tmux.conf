# Reload config shortcut
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# ==============================================================================
# General Options
# ==============================================================================
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
set -g pane-base-index 1
set-window-option -g renumber-windows on

# ==============================================================================
# Custom Keybindings
# ==============================================================================
# Kill pane without confirmation
bind x kill-pane

# Enabling xterm-keys
set -g xterm-keys on
set -g extended-keys on

# ==============================================================================
# Nord (Shaun Singh) Full-Width Status Line
# ==============================================================================
set -g status-position top
set -g status-style "bg=#3b4252,fg=#d8dee9"

set -g status-left-length 100
set -g status-right-length 100

# ------------------------------------------------------------------------------
# Left Side: Session Name (Frost Cyan Badge)
# ------------------------------------------------------------------------------
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold]  #S #[fg=#88c0d0,bg=#3b4252] "

# ------------------------------------------------------------------------------
# Right Side: Current Directory (Teal Badge)
# ------------------------------------------------------------------------------
set -g status-right "#[fg=#8fbcbb,bg=#3b4252]#[fg=#2e3440,bg=#8fbcbb,bold]   #[fg=#eceff4,bg=#3b4252] #{pane_current_path} "

# ------------------------------------------------------------------------------
# Center: Window Tabs (Seamless with Full-Width Bar)
# ------------------------------------------------------------------------------
set -g window-status-separator "  "

# Inactive Windows (Muted Polar Night Text)
set -g window-status-format "#[fg=#4c566a,bg=#3b4252]#I: #W"

# Active Window (Highlighted Frost Blue Pill)
set -g window-status-current-format "#[fg=#81a1c1,bg=#3b4252]#[fg=#2e3440,bg=#81a1c1,bold]#I: #W#[fg=#81a1c1,bg=#3b4252]"

# ==============================================================================
# Nord Popups, Messages & Pane Borders
# ==============================================================================

# High-contrast banner for command prompt and messages
set -g message-style "bg=#88c0d0,fg=#2e3440,bold"
set -g message-command-style "bg=#ebcb8b,fg=#2e3440,bold"

# Interactive selection mode (Prefix + s session list, copy-mode)
set -g mode-style "bg=#81a1c1,fg=#2e3440,bold"

# Active / Inactive Pane borders
set -g pane-border-lines heavy
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"

# ==============================================================================
# Pane Border Indicators (Nord Styled)
# ==============================================================================
# Turn on indicators along the top border line of each pane
set -g pane-border-status bottom

# Format: Display Pane Index, Command/Title, and Current Directory
set -g pane-border-format "#P"
