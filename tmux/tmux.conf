# Reload config shortcut
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
# ==============================================================================
# General Options
# ==============================================================================
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
set -g pane-base-index 1
set-window-option -g renumber-windows on


# ==============================================================================
# Custom Keybindings
# ==============================================================================
# Split pane vertically using PREFIX + | (replaces default of %)
# Keeps cwd in the new pane

# Kill pane without confirmation
bind x kill-pane


# ==============================================================================
# Everforest Dark Hard Full-Width Status Line
# ==============================================================================
set -g status-position top
set -g status-style "bg=#343f44,fg=#d3c6aa"

set -g status-left-length 100
set -g status-right-length 100

# ------------------------------------------------------------------------------
# Left Side: Session Name (Green Badge)
# ------------------------------------------------------------------------------
set -g status-left "#[fg=#272e33,bg=#a7c080,bold]  #S #[fg=#a7c080,bg=#343f44] "

# ------------------------------------------------------------------------------
# Right Side: Current Directory (Aqua Badge)
# ------------------------------------------------------------------------------
set -g status-right "#[fg=#83c092,bg=#343f44]#[fg=#272e33,bg=#83c092,bold]   #[fg=#d3c6aa,bg=#343f44] #{pane_current_path} "

# ------------------------------------------------------------------------------
# Center: Window Tabs (Seamless with Full-Width Bar)
# ------------------------------------------------------------------------------
set -g window-status-separator "  "

# Inactive Windows (Subtle Gray Text)
set -g window-status-format "#[fg=#859289,bg=#343f44]#I: #W"

# Active Window (Highlighted Green Pill)
set -g window-status-current-format "#[fg=#a7c080,bg=#343f44]#[fg=#272e33,bg=#a7c080,bold]#I: #W#[fg=#a7c080,bg=#343f44]"

# ==============================================================================
# Everforest Full-Width Popups & Display Messages (High Contrast)
# ==============================================================================

# High-contrast banner for "Config reloaded!" and command prompt
# Everforest Orange background (#e69875) with Dark Hard text (#272e33)
set -g message-style "bg=#7fbbb3,fg=#272e33,bold"
set -g message-command-style "bg=#e69875,fg=#272e33,bold"

# Interactive selection mode (e.g. Prefix + s session list)
set -g mode-style "bg=#a7c080,fg=#272e33,bold"

# Active / Inactive Pane borders
set -g pane-border-style "fg=#343f44"
set -g pane-active-border-style "fg=#a7c080"
